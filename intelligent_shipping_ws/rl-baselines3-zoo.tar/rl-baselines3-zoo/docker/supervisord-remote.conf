[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork
autostart=true
autorestart=true
priority=10

[program:vnc]
command=/bin/bash -c "su - %(ENV_CONTAINER_USER)s -c 'vncserver -kill %(ENV_DISPLAY)s 2>/dev/null || true; vncserver %(ENV_DISPLAY)s -geometry %(ENV_VNC_RESOLUTION)s -depth 24 -localhost no -SecurityTypes VncAuth -rfbport %(ENV_VNC_PORT)s'"
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/var/log/supervisor/vnc.log
stderr_logfile=/var/log/supervisor/vnc_err.log

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:%(ENV_VNC_PORT)s --listen %(ENV_NOVNC_PORT)s
autostart=true
autorestart=true
priority=30
startsecs=3
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc_err.log

[program:jupyter]
command=/bin/bash -c "su - %(ENV_CONTAINER_USER)s -c 'cd %(ENV_WORKSPACE)s && jupyter lab --no-browser'"
autostart=true
autorestart=true
priority=40
startsecs=5
stdout_logfile=/var/log/supervisor/jupyter.log
stderr_logfile=/var/log/supervisor/jupyter_err.log

[program:tensorboard]
command=/bin/bash -c "su - %(ENV_CONTAINER_USER)s -c '/usr/local/bin/start-tensorboard.sh'"
autostart=true
autorestart=true
priority=50
startsecs=3
stdout_logfile=/var/log/supervisor/tensorboard.log
stderr_logfile=/var/log/supervisor/tensorboard_err.log

[program:sshd]
command=/usr/sbin/sshd -D -p %(ENV_SSH_PORT)s
autostart=%(ENV_ENABLE_SSH)s
autorestart=true
priority=60
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd_err.log
