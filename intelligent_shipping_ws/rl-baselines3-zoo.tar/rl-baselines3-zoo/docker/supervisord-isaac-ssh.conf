[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:jupyter]
command=/bin/bash -c "cd %(ENV_WORKSPACE)s && %(ENV_PYTHON)s -m jupyter lab --no-browser"
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/var/log/supervisor/jupyter.log
stderr_logfile=/var/log/supervisor/jupyter_err.log

[program:tensorboard]
command=/bin/bash -c "/usr/local/bin/start-tensorboard.sh"
autostart=true
autorestart=true
priority=30
startsecs=3
stdout_logfile=/var/log/supervisor/tensorboard.log
stderr_logfile=/var/log/supervisor/tensorboard_err.log

[program:sshd]
command=/usr/sbin/sshd -D -p %(ENV_SSH_PORT)s
autostart=%(ENV_ENABLE_SSH)s
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd_err.log
