apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ship3dof-logs
  namespace: ship3dof
  labels:
    app.kubernetes.io/name: ship3dof
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # storageClassName: fast-ssd  # 按集群实际 StorageClass 修改
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ship3dof-artifacts
  namespace: ship3dof
  labels:
    app.kubernetes.io/name: ship3dof
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName: fast-ssd  # 按集群实际 StorageClass 修改
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ship3dof-logs-autotune
  namespace: ship3dof
  labels:
    app.kubernetes.io/name: ship3dof
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  # storageClassName: fast-ssd
