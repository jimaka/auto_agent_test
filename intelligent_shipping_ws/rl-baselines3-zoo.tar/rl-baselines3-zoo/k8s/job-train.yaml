# 一次性训练 Job — 适合批处理 / CI 流水线
# 用法: kubectl apply -f k8s/job-train.yaml -n ship3dof
apiVersion: batch/v1
kind: Job
metadata:
  generateName: ship3dof-train-
  namespace: ship3dof
  labels:
    app.kubernetes.io/name: ship3dof
    app.kubernetes.io/component: training
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ship3dof
        app.kubernetes.io/component: training
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: train
          image: ship3dof:latest
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/rl-zoo
          command:
            - python3
            - scripts/ship_3dof/run_known_mmg_pipeline.py
          args:
            - --mmg-params
            - scripts/ship_3dof/mmg_params_example.json
            - --generate-trials-if-missing
            - --run-tag
            - k8s_exp
            - --output-dir
            - artifacts/ship_3dof/runs
            - --log-folder
            - logs_pipeline
            - --phase-steps
            - "20000"
            - "20000"
            - "30000"
            - --seed
            - "42"
            - --device
            - cuda
          env:
            - name: PYTHONPATH
              value: /workspace/rl-zoo
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: "64Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: logs
              mountPath: /workspace/rl-zoo/logs_pipeline
            - name: artifacts
              mountPath: /workspace/rl-zoo/artifacts
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: ship3dof-logs
        - name: artifacts
          persistentVolumeClaim:
            claimName: ship3dof-artifacts
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
